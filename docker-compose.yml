# SubSense reference stack: API + maintenance worker + Redis.
#
# The worker is the only process that writes to the databases on a schedule, and Redis holds the
# hot cache. If Redis goes down the addon keeps serving from SQLite, without analytics.
#
# Upgrading from v2.3.x? Run scripts/migrate-db.js once, with everything stopped, BEFORE starting
# this stack. See the Upgrading section in README.md.

services:
  subsense:
    build: .
    image: stremio-subsense:latest
    container_name: stremio-subsense
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3100:3100"
    env_file:
      - .env.dockhand
    # --- WARP requirements ---
    cap_add:
       - NET_ADMIN
    devices:
       - /dev/net/tun:/dev/net/tun
    sysctls:
       - net.ipv6.conf.all.disable_ipv6=0
       - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - subsense-data:/app/data
      - warp-data:/var/lib/cloudflare-warp

  worker:
    build: .
    image: stremio-subsense:latest
    container_name: stremio-subsense-worker
    restart: unless-stopped
    init: true                                 # so SIGTERM reaches node and the final drain runs
    command: ["node", "worker.js"]
    healthcheck:
      disable: true                            # no HTTP listener; /health/deep reports on it
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.dockhand
    environment:
      - WARP_ENABLED=false                     # the worker makes no upstream provider calls
      - NODE_OPTIONS=--max-old-space-size=512
    volumes:
      - subsense-data:/app/data                # same volume as the API

  redis:
    image: redis:7.2-alpine
    container_name: subsense-redis
    restart: unless-stopped
    # volatile-lru is deliberate: TTL-bearing cache keys are evictable, while the analytics
    # counter hash and the content-log queue carry no TTL and survive memory pressure.
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
      --save 300 100
      --appendonly no
    volumes:
      - subsense-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  subsense-data:
  subsense-redis:
  warp-data:
